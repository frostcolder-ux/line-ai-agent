<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小凡後台登入</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #1a3c2e; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 380px; border-radius: 1rem; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.3); }
    .login-header { background: #2d5c42; color: #fff; padding: 2rem; text-align: center; }
    .login-header h1 { font-size: 1.5rem; margin: 0; }
    .login-header p { margin: .5rem 0 0; color: #b0d4bc; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="login-card bg-white">
    <div class="login-header">
      <div style="font-size:2.5rem">🌿</div>
      <h1>小凡後台管理</h1>
      <p>思凡社會農場</p>
    </div>
    <div class="p-4">
      {% if error %}
        <div class="alert alert-danger py-2">{{ error }}</div>
      {% endif %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">管理員密碼</label>
          <input type="password" name="password" class="form-control" placeholder="請輸入密碼" autofocus required>
        </div>
        <button type="submit" class="btn w-100" style="background:#1a3c2e;color:#fff">登入</button>
      </form>
    </div>
  </div>
</body>
</html>
