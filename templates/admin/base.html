<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}小凡後台{% endblock %} — 思凡社會農場</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .sidebar {
      min-height: 100vh;
      background: #1a3c2e;
      color: #c8e6d0;
      width: 220px;
      position: fixed;
      top: 0; left: 0;
      padding: 1.5rem 0;
      z-index: 100;
    }
    .sidebar .brand {
      padding: 0 1.2rem 1.5rem;
      border-bottom: 1px solid #2d5c42;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
    }
    .sidebar .brand small { display: block; font-size: .7rem; font-weight: 400; color: #88b89a; }
    .sidebar .nav-link {
      color: #b0d4bc;
      padding: .6rem 1.2rem;
      border-radius: 0;
      display: flex; align-items: center; gap: .6rem;
    }
    .sidebar .nav-link:hover, .sidebar .nav-link.active {
      background: #2d5c42; color: #fff;
    }
    .sidebar .nav-link i { font-size: 1rem; }
    .main { margin-left: 220px; padding: 2rem; }
    .page-header {
      background: #fff;
      border-radius: .75rem;
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      display: flex; align-items: center; gap: .75rem;
    }
    .page-header h1 { font-size: 1.3rem; margin: 0; font-weight: 700; }
    .card { border: none; border-radius: .75rem; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    textarea.code-editor {
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: .85rem;
      line-height: 1.6;
      min-height: 420px;
      resize: vertical;
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 1rem; }
    }
  </style>
</head>
<body>

<div class="sidebar d-flex flex-column">
  <div class="brand">
    🌿 小凡後台
    <small>思凡社會農場</small>
  </div>
  <nav class="nav flex-column mt-2">
    <a class="nav-link {% if request.endpoint == 'admin.dashboard' %}active{% endif %}"
       href="{{ url_for('admin.dashboard') }}">
      <i class="bi bi-speedometer2"></i> 總覽
    </a>
    <a class="nav-link {% if request.endpoint == 'admin.prompt' %}active{% endif %}"
       href="{{ url_for('admin.prompt') }}">
      <i class="bi bi-chat-square-text"></i> 系統 Prompt
    </a>
    <a class="nav-link {% if request.endpoint == 'admin.knowledge' %}active{% endif %}"
       href="{{ url_for('admin.knowledge') }}">
      <i class="bi bi-book"></i> 農業知識庫
    </a>
    <a class="nav-link {% if request.endpoint == 'admin.groups' %}active{% endif %}"
       href="{{ url_for('admin.groups') }}">
      <i class="bi bi-people"></i> 群組管理
    </a>
    <a class="nav-link {% if request.endpoint == 'admin.settings' %}active{% endif %}"
       href="{{ url_for('admin.settings') }}">
      <i class="bi bi-gear"></i> 設定
    </a>
    <a class="nav-link {% if request.endpoint == 'admin.logs' %}active{% endif %}"
       href="{{ url_for('admin.logs') }}">
      <i class="bi bi-list-ul"></i> Webhook 紀錄
    </a>
  </nav>
  <div class="mt-auto px-3 pb-2">
    <a href="{{ url_for('admin.logout') }}" class="btn btn-sm btn-outline-light w-100">
      <i class="bi bi-box-arrow-left"></i> 登出
    </a>
  </div>
</div>

<div class="main">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
